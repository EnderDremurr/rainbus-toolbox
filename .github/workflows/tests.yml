name: Tests
on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --logger trx
      - uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: "**/*.trx"
          reporter: dotnet-trx
