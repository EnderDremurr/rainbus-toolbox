name: Release Rainbus Toolbox

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_REF##refs/tags/}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-local"
          fi
          VERSION="${VERSION#v}"
          VERSION=$(echo "$VERSION" | tr -c '[:alnum:].+-' '-')
          VERSION="${VERSION%-}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Linux
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r linux-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/linux-x64
          chmod +x out/linux-x64/RainbusToolbox
          tar -czf RainbusToolbox-linux-x64-${VERSION}.tar.gz -C out/linux-x64 .

      - name: Build Windows
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r win-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/win-x64
          (cd out/win-x64 && zip -r ../../RainbusToolbox-win-x64-${VERSION}.zip .)

      - name: Build macOS x64
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r osx-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/osx-x64
          chmod +x out/osx-x64/RainbusToolbox
          tar -czf RainbusToolbox-osx-x64-${VERSION}.tar.gz -C out/osx-x64 .

      - name: Build macOS arm64
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r osx-arm64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/osx-arm64
          chmod +x out/osx-arm64/RainbusToolbox
          tar -czf RainbusToolbox-osx-arm64-${VERSION}.tar.gz -C out/osx-arm64 .

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release upload "$VERSION" RainbusToolbox-linux-x64-${VERSION}.tar.gz --clobber
          gh release upload "$VERSION" RainbusToolbox-win-x64-${VERSION}.zip --clobber
          gh release upload "$VERSION" RainbusToolbox-osx-x64-${VERSION}.tar.gz --clobber
          gh release upload "$VERSION" RainbusToolbox-osx-arm64-${VERSION}.tar.gz --clobber

      - name: Notify Discord
        uses: teneplaysofficial/releasify-action@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Новый релиз Тулбокса!"
          color: "#901d22"
          mention: "@here"
          image: "https://cdn.discordapp.com/attachments/1034132702712037438/1516266740261322782/images_3ad5fa8d-0743-4a.gif?ex=6a6963f1&is=6a681271&hm=447bec77a5866bf83f67f02706bcbaf9a85cc3c9d9b54a51c929c620b42f144c&"
          username: "Елена Дилдо"
          avatar_url: "https://cdn.discordapp.com/attachments/1507019573080231938/1531590904455106790/3hh6b35.jpeg?ex=6a69c4af&is=6a68732f&hm=aeac1458eadb21b73b2e1330fc55dfd17494d370846fc38c3adf36ad358177c0&"
