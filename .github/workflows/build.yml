name: Release Rainbus Toolbox

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_REF##refs/tags/}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-local"
          fi
          VERSION="${VERSION#v}"
          VERSION=$(echo "$VERSION" | tr -c '[:alnum:].+-' '-')
          VERSION="${VERSION%-}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV

      - name: Build Linux
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r linux-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/linux-x64
          chmod +x out/linux-x64/RainbusToolbox
          tar -czf RainbusToolbox-linux-x64-${VERSION}.tar.gz -C out/linux-x64 .

      - name: Build Windows
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r win-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/win-x64
          (cd out/win-x64 && zip -r ../../RainbusToolbox-win-x64-${VERSION}.zip .)

      - name: Build macOS x64
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r osx-x64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/osx-x64
          chmod +x out/osx-x64/RainbusToolbox
          tar -czf RainbusToolbox-osx-x64-${VERSION}.tar.gz -C out/osx-x64 .

      - name: Build macOS arm64
        run: |
          dotnet publish RainbusToolbox.csproj -c Release -r osx-arm64 --self-contained true \
            /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true \
            /p:AssemblyName=RainbusToolbox -o out/osx-arm64
          chmod +x out/osx-arm64/RainbusToolbox
          tar -czf RainbusToolbox-osx-arm64-${VERSION}.tar.gz -C out/osx-arm64 .

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release upload "$TAG" RainbusToolbox-linux-x64-${VERSION}.tar.gz --clobber
          gh release upload "$TAG" RainbusToolbox-win-x64-${VERSION}.zip --clobber
          gh release upload "$TAG" RainbusToolbox-osx-x64-${VERSION}.tar.gz --clobber
          gh release upload "$TAG" RainbusToolbox-osx-arm64-${VERSION}.tar.gz --clobber

      - name: Find previous tag
        run: | 
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          echo "PREV=$PREV" >> $GITHUB_ENV

      - name: Add changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          BODY: ${{ github.event.release.body }}
        run: |
          printf '%s\n\n# Changes:\n\n' "$BODY" > notes.md
          git log "$PREV..$TAG" --no-merges \
          --pretty=format:"* [%s](https://github.com/${{ github.repository }}/commit/%H)" >> notes.md
          gh release edit "$TAG" --notes-file notes.md


      - name: Discord release message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          LINKS_TEXT="[Windows](${BASE}/RainbusToolbox-win-x64-${VERSION}.zip) **|** [Linux](${BASE}/RainbusToolbox-linux-x64-${VERSION}.tar.gz) **|** [macOS Intel](${BASE}/RainbusToolbox-osx-x64-${VERSION}.tar.gz) **|** [macOS Apple Silicon](${BASE}/RainbusToolbox-osx-arm64-${VERSION}.tar.gz)"

          CONTENT=$(printf '# Новый релиз Тулбокса!\n@here\n### Ссылки для скачивания:\n%s' "$LINKS_TEXT")

          jq -n \
            --arg username "Елена Дилдо" \
            --arg avatar_url "https://cdn.discordapp.com/attachments/1507019573080231938/1531590904455106790/3hh6b35.jpeg?ex=6a69c4af&is=6a68732f&hm=aeac1458eadb21b73b2e1330fc55dfd17494d370846fc38c3adf36ad358177c0&" \
            --arg content "$CONTENT" \
            --arg title "$RELEASE_NAME" \
            --arg color "9444642" \
            --rawfile description notes.md \
            '{
              username: $username,
              avatar_url: $avatar_url,
              content: $content,
              embeds: [
                {
                  title: $title,
                  description: $description[0:4000],
                  color: ($color | tonumber)
                }
              ]
            }' |
            curl --fail-with-body --silent --show-error \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$WEBHOOK"

